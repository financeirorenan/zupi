crons:
  - name: invoice-reminders
    description: "Avisa lojistas 2 dias antes do vencimento da fatura Zupi e fecha períodos encerrados"
    cron: "0 9 * * *"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/cron/invoice-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
